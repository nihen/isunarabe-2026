# nrb2026 vhost. Skeleton — not yet flipped on:
# Activating nginx requires also pushing port.conf drop-in (PORT=8080) so webapp
# stops listening on :80. See scripts/setup-nginx.sh.

upstream nrb2026_app {
    # Local webapp first, app2 as additional capacity.
    server 127.0.0.1:8080;
    server 192.168.0.12:8080;
    keepalive 64;
}

server {
    listen 80 default_server reuseport;
    listen [::]:80 default_server reuseport;
    server_name _;

    client_max_body_size 20M;   # campaign images can be large; tune to bench expectations

    # SPA: serve static assets directly from disk (regulation forbids editing them).
    root /home/isucon/webapp/public;

    location = / {
        try_files /index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1h;
    }

    location /api/ {
        proxy_pass http://nrb2026_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location /healthz {
        proxy_pass http://nrb2026_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # SPA fallback for any other path.
    location / {
        try_files $uri /index.html;
    }
}
