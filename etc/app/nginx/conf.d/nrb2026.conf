upstream app {
    server 192.168.0.11:8080 max_fails=0;   # nrb2026-1
    server 192.168.0.12:8080 max_fails=0;   # nrb2026-2
    keepalive 64;
}

upstream db_app {
    server 192.168.0.13:8080;
    keepalive 8;
}

server {
    listen 80 default_server reuseport;
    server_name _;

    client_max_body_size 20M;

    root /home/isucon/webapp/public;

    location = / {
        try_files /index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1h;
    }

    # /api/initialize → DB host's webapp (seed.sql loads via localhost mysql)
    location = /api/initialize {
        proxy_pass http://db_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    location /healthz {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }
}
