# /etc/nginx/nginx.conf — ISUCON-tuned baseline.
# Deploy: scripts/deploy-config.sh app  (then sudo nginx -s reload, or systemctl restart nginx)
user www-data;
worker_processes auto;
worker_rlimit_nofile 65536;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    types_hash_max_size 2048;
    server_tokens off;

    # gzip the SPA bundle and JSON responses (front static files are immutable per regulation).
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Logs (off by default during contest, flip on to inspect with alp).
    access_log off;
    error_log  /var/log/nginx/error.log warn;

    include /etc/nginx/conf.d/*.conf;
}
