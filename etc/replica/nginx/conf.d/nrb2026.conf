# Campaign-ID sharding: join + get/:id → hash consistent, rest → local

map $uri $campaign_id {
    default "";
    ~^/api/campaigns/(?<cid>[a-f0-9-]+) $cid;
}

upstream campaign_shards {
    hash $campaign_id consistent;
    server 192.168.0.11:8080;
    server 192.168.0.12:8080;
    keepalive 128;
}

upstream local_app {
    server 127.0.0.1:8080;
    keepalive 128;
}

server {
    listen 80 default_server reuseport;
    server_name _;
    client_max_body_size 20M;
    root /home/isucon/webapp/public;

    location = / { try_files /index.html =404; }
    location /assets/ { try_files $uri =404; access_log off; expires 1h; }

    # Campaign-specific → shard by campaign_id
    location ~ ^/api/campaigns/[a-f0-9-]+(/.*)?$ {
        proxy_pass http://campaign_shards;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-User-Id $http_x_user_id;
        proxy_read_timeout 30s;
    }

    # Everything else → local (list, me, charges, tags, users, saved_searches, initialize)
    location /api/ {
        proxy_pass http://local_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-User-Id $http_x_user_id;
        proxy_read_timeout 30s;
    }

    location /internal/ {
        proxy_pass http://local_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    location /healthz {
        proxy_pass http://local_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location / { try_files $uri /index.html; }
}
