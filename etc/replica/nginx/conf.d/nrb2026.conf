# nrb2026-2 (replica): write → authority, read → local
upstream authority {
    server 192.168.0.11:8080;
    keepalive 128;
}

upstream local_app {
    server 127.0.0.1:8080;
    keepalive 128;
}

server {
    listen 80 default_server reuseport;
    server_name _;
    client_max_body_size 20M;
    root /home/isucon/webapp/public;

    location = / { try_files /index.html =404; }
    location /assets/ { try_files $uri =404; access_log off; expires 1h; }

    # ── Write endpoints → authority ──
    location = /api/initialize {
        proxy_pass http://authority;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-User-Id $http_x_user_id;
        proxy_read_timeout 30s;
    }
    location = /api/users {
        proxy_pass http://authority;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
    location = /api/saved_searches {
        proxy_pass http://authority;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-User-Id $http_x_user_id;
        proxy_read_timeout 30s;
    }
    location ~ ^/api/campaigns/[a-f0-9-]+/join$ {
        proxy_pass http://authority;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-User-Id $http_x_user_id;
        proxy_read_timeout 30s;
    }

    # ── /api/campaigns: POST → authority, GET → local ──
    location = /api/campaigns {
        set $upstream local_app;
        if ($request_method != GET) {
            set $upstream authority;
        }
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-User-Id $http_x_user_id;
        proxy_read_timeout 30s;
    }

    # ── Read endpoints → local ──
    location /api/ {
        proxy_pass http://local_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-User-Id $http_x_user_id;
        proxy_read_timeout 30s;
    }

    location /healthz {
        proxy_pass http://local_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location / { try_files $uri /index.html; }
}
